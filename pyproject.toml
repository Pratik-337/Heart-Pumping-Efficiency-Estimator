[project]
name = "echoef"
version = "0.1.0"
description = "Heart Pumping Efficiency Estimator: cost-measured frame-efficiency study of EF prediction on EchoNet-Dynamic with R(2+1)D-18"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "captum>=0.9.0",
    "gradio>=6.32.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "omegaconf>=2.4.0",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "tensorboard>=2.21.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]  # never reformat the spec's code blocks

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
